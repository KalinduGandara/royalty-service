spring.mvc.view.prefix=/WEB-INF/view/
spring.mvc.view.suffix=.jsp

spring.datasource.url=jdbc:mysql://localhost:3306/royalty
spring.datasource.username=royalty
spring.datasource.password=royalty
spring.jpa.hibernate.ddl-auto=update

server.error.whitelabel.enabled=false

server.port=8080

logging.file.name=log/royalty.log
#logging.file.path=var/log

sms.api.key=qwe
sms.api.url=http://localhost:8080/api/sms
# set time in milliseconds
sms.scheduler.fixedDelay=500
# Scheduler threads. Keep above 1 so a send that is waiting on the gateway
# cannot hold up the crediting of inbound codes.
sms.scheduler.poolSize=2
# Gateway HTTP timeouts, in milliseconds. The JDK default is no timeout, which
# lets a gateway that accepts a connection and never answers block delivery
# until the application is restarted.
sms.api.connect-timeout-ms=5000
sms.api.read-timeout-ms=10000
# Abandon a run after this many consecutive failures rather than spending a
# timeout on every queued message while the gateway is down.
sms.api.max-consecutive-failures=5
spring.application.name=loyalty

#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
